<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><title>SIFM 2026 — Commande</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#1c0c34,#37114e 65%,#102d68);color:white;font-family:Arial,sans-serif;min-height:100dvh;padding:24px 16px}.panel{max-width:550px;margin:auto;background:#ffffff12;border:1px solid #ffffff35;border-radius:24px;padding:25px;box-shadow:0 20px 55px #0004}h1{margin:0 0 5px;font-size:25px}.sub{color:#ddd1ec;font-size:14px;margin-bottom:22px}.time{font-size:clamp(78px,19vw,130px);text-align:center;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.06em;margin:12px 0 16px}.field{display:flex;gap:12px;align-items:end;margin:20px 0}label{flex:1;font-size:14px;color:#ddd}input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff60;background:#ffffff;color:#191126;font-size:20px;margin-top:7px}button{cursor:pointer;border:0;border-radius:13px;padding:16px 10px;font-size:17px;font-weight:800}button:disabled{opacity:.45;cursor:not-allowed}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.presets button{background:#ffffff22;color:white;border:1px solid #ffffff45}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.start{background:#36d394;color:#072c22}.pause{background:#f7c85e;color:#322100}.reset{background:#fff;color:#25132f}.set{background:#cbb3ff;color:#23113d;width:100%}.message{margin-top:16px;min-height:38px;color:#e7dff1;font-size:14px;line-height:1.5}.link{display:block;text-align:center;color:#fff;margin-top:22px}.status{font-size:13px;color:#d8c9ec}.hide{display:none}.codebox{margin:20px 0}@media(max-width:420px){.panel{padding:18px}.time{font-size:22vw}}</style></head><body><div class="panel"><h1>Commande du chronomètre</h1><div class="sub">Sélestat International F3P Masters · SIFM 2026</div><div id="gate"><label>Code de session<input id="code" placeholder="SIFM2026" autocomplete="off" autocapitalize="characters"></label><div style="height:12px"></div><button class="set" id="connect">Connecter</button></div><div id="controls" class="hide"><div class="status" id="status">Connexion…</div><div class="time" id="clock">05:00</div><div class="presets"><button data-min="2">2 min</button><button data-min="3">3 min</button><button data-min="4">4 min</button><button data-min="5">5 min</button></div><div class="field"><label>Minutes<input type="number" id="minutes" min="0" max="999" value="5" inputmode="numeric"></label><label>Secondes<input type="number" id="seconds" min="0" max="59" value="0" inputmode="numeric"></label></div><button class="set" id="apply">Appliquer la durée</button><div class="actions"><button class="start" id="start">Démarrer / Reprendre</button><button class="pause" id="pause">Pause</button><button class="reset" id="reset">Réinitialiser</button><button class="reset" id="fullscreen">Affichage ↗</button></div><div class="message" id="message"></div></div></div><script>const firebaseConfig = {apiKey:"AIzaSyCUbq1DugNpbd57Wu7_ZyTkhQiGsWkgPtI",authDomain:"sifm2026.firebaseapp.com",databaseURL:"https://sifm2026-default-rtdb.europe-west1.firebasedatabase.app",projectId:"sifm2026",storageBucket:"sifm2026.firebasestorage.app",messagingSenderId:"1041971822818",appId:"1:1041971822818:web:6c638c47da96f2b4e99ebb"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database(),stateRef=db.ref('sessions/SIFM2026/state');let offset=0;db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);const now=()=>Date.now()+offset;
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

const gate=document.getElementById('gate'),controls=document.getElementById('controls'),clock=document.getElementById('clock'),msg=document.getElementById('message'),statusEl=document.getElementById('status');let state={durationMs:300000,remainingMs:300000,status:'idle'},ready=false,connected=false,busy=false;
function remaining(s){return s.status==='running'?Math.max(0,(s.endAt||0)-now()):(s.remainingMs??s.durationMs??300000)}function draw(){clock.textContent=fmt(remaining(state));document.getElementById('start').disabled=!ready||busy||state.status==='running';document.getElementById('pause').disabled=!ready||busy||state.status!=='running';document.getElementById('reset').disabled=!ready||busy;document.getElementById('apply').disabled=!ready||busy}setInterval(draw,100);
function notify(t){msg.textContent=t}function update(transform){if(!ready||busy)return;busy=true;draw();stateRef.transaction(current=>{let s=current||{durationMs:300000,remainingMs:300000,status:'idle'};return transform(s,now())},(error,committed)=>{busy=false;if(error)notify('Erreur : '+error.message);else if(!committed)notify('Commande annulée');else notify('Commande envoyée ✓');draw()},false)}
document.getElementById('connect').onclick=()=>{if(document.getElementById('code').value.trim().toUpperCase()!=='SIFM2026'){alert('Code incorrect');return}gate.classList.add('hide');controls.classList.remove('hide');statusEl.textContent='Connexion Firebase…';auth.signInAnonymously().then(()=>{stateRef.on('value',snap=>{if(snap.exists()){state=snap.val();ready=true}else{ready=true;stateRef.transaction(s=>s||{durationMs:300000,remainingMs:300000,status:'idle'},()=>{},false)}draw()},e=>notify('Erreur de lecture : '+e.message));db.ref('.info/connected').on('value',s=>{connected=!!s.val();statusEl.textContent=connected?'● Connecté à Firebase':'○ Hors connexion';})}).catch(e=>notify('Erreur authentification : '+e.message))};
document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{document.getElementById('minutes').value=b.dataset.min;document.getElementById('seconds').value=0;applyDuration()});
function applyDuration(){let m=Number(document.getElementById('minutes').value),s=Number(document.getElementById('seconds').value);if(!Number.isInteger(m)||!Number.isInteger(s)||m<0||m>999||s<0||s>59||(m===0&&s===0)){notify('Indique une durée valide (au moins 1 seconde).');return}let durationMs=(m*60+s)*1000;update(old=>({durationMs,remainingMs:durationMs,status:'idle',endAt:null}))}
document.getElementById('apply').onclick=applyDuration;
document.getElementById('start').onclick=()=>update((s,t)=>{if(s.status==='running')return s;let ms=remaining(s);if(ms<=0)ms=s.durationMs||300000;return {...s,status:'running',remainingMs:ms,endAt:t+ms}});
document.getElementById('pause').onclick=()=>update((s,t)=>{if(s.status!=='running')return s;return {...s,status:'paused',remainingMs:Math.max(0,(s.endAt||0)-t),endAt:null}});
document.getElementById('reset').onclick=()=>update(s=>({...s,status:'idle',remainingMs:s.durationMs||300000,endAt:null}));
document.getElementById('fullscreen').onclick=()=>window.open('affichage.html','_blank');
</script></body></html>
