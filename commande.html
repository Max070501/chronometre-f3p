<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F3P — Télécommande</title><style>body{background:#0b1422;color:white;font:18px Arial,sans-serif;margin:0;padding:24px}main{max-width:480px;margin:auto}h1{text-align:center}label{display:block;margin:16px 0 8px;color:#b4c6df}input{box-sizing:border-box;width:100%;font-size:26px;padding:14px;border:1px solid #60718a;border-radius:12px;background:#1d2c40;color:white}button{font-size:20px;padding:16px;border:0;border-radius:12px;color:white;background:#2468c9;cursor:pointer;width:100%;margin-top:12px}button:disabled{opacity:.45}.green{background:#18814e}.gray{background:#47576b}.orange{background:#a95b1c}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row input{text-align:center}#clock{text-align:center;font-size:75px;font-weight:bold;font-variant-numeric:tabular-nums;margin:25px 0}#status{text-align:center;color:#bed0e9}#notice{color:#ffcf88;text-align:center;min-height:28px}hr{border:0;border-top:1px solid #3a4c64;margin:25px 0}</style></head><body><main><h1>F3P · Télécommande</h1><label for="code">Code écran (6 chiffres)</label><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="7" placeholder="070501" value="070501"><button id="connect">Connecter l'écran</button><div id="notice">Saisis le code affiché sur le PC.</div><hr><div id="clock">05:00</div><div id="status">Non connecté</div><label>Durée du décompte</label><div class="row"><div><input id="min" type="number" min="0" max="599" value="5"><label>Minutes</label></div><div><input id="sec" type="number" min="0" max="59" value="0"><label>Secondes</label></div></div><button class="gray control" id="apply" disabled>Appliquer la durée</button><div class="row"><button class="green control" data-command="start" disabled>Démarrer / Reprendre</button><button class="orange control" data-command="pause" disabled>Pause</button></div><button class="gray control" data-command="reset" disabled>Réinitialiser</button></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const $=id=>document.getElementById(id);let peer,conn,latest,receivedAt=0;const prefix='f3p-chrono-simple-';function controls(enabled){document.querySelectorAll('.control').forEach(b=>b.disabled=!enabled)}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function draw(){if(!latest)return;let s=latest.remaining;if(latest.running)s=Math.max(0,Math.ceil((latest.remaining*1000-(Date.now()-receivedAt))/1000));$('clock').textContent=fmt(s);$('status').textContent=s===0?'TEMPS ÉCOULÉ':latest.running?'EN COURS':'EN PAUSE / PRÊT'}function send(type,seconds){if(conn?.open)conn.send({type,seconds})}function link(){let code=$('code').value.replace(/\D/g,'');if(!/^\d{6}$/.test(code)){$('notice').textContent='Entre exactement 6 chiffres.';return}if(!window.Peer){$('notice').textContent='Impossible de charger la connexion Internet.';return}controls(false);$('notice').textContent='Connexion en cours…';if(conn)conn.close();if(peer)peer.destroy();peer=new Peer();peer.on('open',()=>{conn=peer.connect(prefix+code,{reliable:true});conn.on('open',()=>{$('notice').textContent='Connecté à l’écran';controls(true)});conn.on('data',m=>{if(m.type==='state'){latest=m;receivedAt=Date.now();draw()}});conn.on('close',()=>{controls(false);$('notice').textContent='Connexion interrompue';$('status').textContent='Déconnecté'});conn.on('error',()=>{$('notice').textContent='Connexion impossible';controls(false)})});peer.on('error',e=>{$('notice').textContent='Erreur : '+e.type;controls(false)})} $('connect').onclick=link;document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>send(b.dataset.command));$('apply').onclick=()=>{const m=Number($('min').value),s=Number($('sec').value),total=m*60+s;if(!Number.isInteger(total)||total<1||total>35999||s<0||s>59||m<0){$('notice').textContent='Durée invalide';return}send('set',total)};setInterval(draw,100);const param=new URLSearchParams(location.search).get('code');if(param&&/^\d{6}$/.test(param))$('code').value=param;
</script></body></html>
