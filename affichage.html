ult-rtdb.europe-west1.firebasedatabase.app",projectId:"sifm2026",storageBucket:"sifm2026.firebasestorage.app",messagingSenderId:"1041971822818",appId:"1:1041971822818:web:6c638c47da96f2b4e99ebb"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database(),stateRef=db.ref('sessions/SIFM2026/state');let offset=0;db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);const now=()=>Date.now()+offset;

// Le son est produit uniquement sur le PC d'affichage, jamais sur la commande.
let soundEnabled=true, autoRestart=false, audioReady=false, audioContext=null;
const audioButton=document.getElementById('audioUnlock');
const announcementFiles={one:new Audio('annonce_1min.mp3'),twenty:new Audio('annonce_20s.mp3')};
Object.values(announcementFiles).forEach(a=>{a.preload='auto';a.volume=1;});

 try{
  audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
  await audioContext.resume();
  audioReady=true;audioButton.classList.add('hidden');
  audioInfo('Audio autorisé. Cliquez sur « Tester annonce anglaise ».');

}

 if(!manual&&(!soundEnabled||!audioReady))return;
 if(manual&&!soundEnabled){audioInfo('Son désactivé dans les paramètres avancés de la commande.');return;}
 const a=announcementFiles[which];if(!a)return;
 try{
  a.pause();a.currentTime=0;
  await a.play();
  audioInfo(manual?'Annonce de test en lecture.':'Annonce '+(which==='one'?'1 minute':'20 secondes')+' déclenchée.');
 }catch(e){
  audioInfo('Lecture impossible : '+e.message+' — Vérifiez que annonce_1min.mp3 et annonce_20s.mp3 sont sur GitHub.');

function beep(){if(!soundEnabled||!audioReady||!audioContext)return;const t=audioContext.currentTime;const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.65,t+.025);g.gain.setValueAtTime(.65,t+.68);g.gain.exponentialRampToValueAtTime(.0001,t+.85);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.86);}
let lastMs=null, lastStatus='idle', announced={one:false,twenty:false,zero:false};let lastCycleEndAt=null, restarting=false;
function checkAudio(ms){if(state.status==='running' && state.endAt!==lastCycleEndAt){lastCycleEndAt=state.endAt;announced={one:false,twenty:false,zero:false};if(lastStatus==='running' && lastMs!==null && lastMs<=0)lastMs=ms;}if(state.status==='idle'){announced={one:false,twenty:false,zero:false};lastMs=ms;lastStatus='idle';return;}
if(state.status!=='running'){lastMs=ms;lastStatus=state.status;return;}
if(lastStatus!=='running'){lastMs=ms;lastStatus='running';return;}
if(lastMs!==null&&ms<lastMs){if(lastMs>60000&&ms<=60000&&!announced.one){announced.one=true;announce('one');}if(lastMs>20000&&ms<=20000&&!announced.twenty){announced.twenty=true;announce('twenty');}if(lastMs>0&&ms<=0&&!announced.zero){announced.zero=true;beep();}}
lastMs=ms;lastStatus='running';}
function restartIfElapsed(ms){if(!autoRestart||restarting||state.status!=='running'||ms>0)return;restarting=true;stateRef.transaction(s=>{if(!s||s.status!=='running'||!s.endAt||s.endAt>now())return;const duration=s.durationMs||300000;const cycles=Math.floor((now()-s.endAt)/duration)+1;return {...s,status:'running',remainingMs:duration,endAt:s.endAt+cycles*duration};},(err,committed)=>{restarting=false;if(err)console.error('Redémarrage automatique :',err);},false);}
let state={durationMs:300000,remainingMs:300000,status:'idle'};const clock=document.getElementById('clock'),statusEl=document.getElementById('status');function draw(){let ms=state.status==='running'?Math.max(0,(state.endAt||0)-now()):state.remainingMs??state.durationMs??300000;clock.textContent=fmt(ms);checkAudio(ms);restartIfElapsed(ms);clock.classList.toggle('finished',state.status==='running'&&ms<=0)}setInterval(draw,100);draw();auth.signInAnonymously().then(()=>{db.ref('sessions/SIFM2026/autoRestart').on('value',snap=>{autoRestart=snap.val()===true;});db.ref('sessions/SIFM2026/soundEnabled').on('value',snap=>{soundEnabled=snap.val()!==false;if(!soundEnabled)Object.values(announcementFiles).forEach(a=>{a.pause();a.currentTime=0;});});stateRef.on('value',snap=>{if(snap.exists())state=snap.val();draw();statusEl.textContent='● Synchronisé';},err=>statusEl.textContent='Erreur : '+err.message);db.ref('.info/connected').on('value',s=>{statusEl.textContent=s.val()?'● Connecté':'○ Hors connexion'})}).catch(e=>statusEl.textContent='Erreur connexion : '+e.message);
