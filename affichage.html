<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIFM 2026 — Affichage</title><link rel="stylesheet" href="style.css"><style>
/* Styles autonomes : fonctionne même si style.css n'est pas publié */
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
body.display{position:relative;width:100vw;height:100vh;height:100dvh;background:#101a38 url('assets/fond.png') center center/cover no-repeat;color:#fff}
body.display::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,25,.3),rgba(3,8,22,.65) 48%,rgba(3,8,22,.75));pointer-events:none}
.display-content{position:relative;z-index:1;width:100%;height:100%;display:grid;grid-template-rows:minmax(0,24%) minmax(0,1fr) minmax(0,15%);justify-items:center;align-items:center;padding:1vh 3vw 2vh}
.logo{display:block;height:100%;max-height:21vh;max-width:65vw;width:auto;object-fit:contain;filter:drop-shadow(0 4px 14px #0009)}
.center{min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.clock{font-size:min(24vw,43vh);font-weight:900;line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;text-shadow:0 6px 30px #000c}
.clock.orange{color:#ffb12d}.clock.red{color:#ff4b50}
.state{font-weight:800;letter-spacing:.25em;font-size:clamp(13px,1.4vw,23px);margin-top:1vh}
.flags{width:min(780px,80vw);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center;justify-items:center;gap:clamp(8px,2vw,30px)}
.flag{display:block;width:100%;max-width:100px;height:auto;aspect-ratio:3/2;object-fit:contain;border:1px solid #ffffff99;box-shadow:0 3px 12px #0008}
.display-status{position:absolute;z-index:2;top:12px;right:14px;font-size:12px;color:#fff;background:#0007;padding:6px 9px;border-radius:6px}
.fullscreen{position:absolute;z-index:2;bottom:10px;right:12px;border:1px solid #ffffff77;border-radius:8px;background:#0009;color:#fff;padding:8px 12px;cursor:pointer}
@media(max-width:700px){.display-content{grid-template-rows:22% 1fr 15%}.clock{font-size:min(25vw,37vh)}.flags{width:88vw;gap:7px}.display-status{font-size:10px}}

/* SIFM 2026 — Affichage grand écran, 16:9 */
body.display .display-content{
 display:grid;grid-template-rows:minmax(0,24vh) minmax(0,1fr) minmax(0,14vh);
 justify-items:center;align-items:center;width:100%;height:100dvh;
 padding:1.5vh 2vw 2vh;gap:0;
}
body.display .logo{height:100%;max-height:23vh;max-width:65vw;width:auto;object-fit:contain}
body.display .center{width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
body.display .clock{font-family:Arial,Helvetica,sans-serif;font-size:min(29vw,49vh);font-weight:900;letter-spacing:-.07em;line-height:1.02;padding:0 .03em;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center}
body.display .state{font-size:clamp(13px,1.4vw,24px);margin-top:1vh}
body.display .flags{width:100%;max-width:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center;justify-items:center;gap:1.5vw;padding:0 1vw}
body.display .flag{display:block;width:min(12vw,180px);max-width:100%;height:auto;aspect-ratio:3/2;object-fit:contain;border:1px solid #ffffffaa;box-shadow:0 4px 15px #0007}
@media(max-width:750px){body.display .display-content{grid-template-rows:23vh 1fr 13vh;padding:1vh 1.5vw 2vh}body.display .clock{font-size:min(28vw,42vh)}body.display .flag{width:13vw}body.display .flags{gap:1vw}}
@media(max-height:600px){body.display .display-content{grid-template-rows:20vh 1fr 14vh}body.display .clock{font-size:min(28vw,46vh)}}
</style></head><body class="display"><div class="display-content"><img class="logo" src="assets/logo.png" alt="Logo SIFM"><main class="center"><div id="clock" class="clock">05:00</div><div id="state" class="state">ARRÊTÉ</div></main><div class="flags" aria-label="Nations participantes"><img class="flag" src="assets/de.svg" alt="Allemagne"><img class="flag" src="assets/at.svg" alt="Autriche"><img class="flag" src="assets/fr.svg" alt="France"><img class="flag" src="assets/cz.svg" alt="République tchèque"><img class="flag" src="assets/sk.svg" alt="Slovaquie"><img class="flag" src="assets/ch.svg" alt="Suisse"></div></div><div id="connection" class="display-status">Connexion au service…</div><button id="fullscreen" class="fullscreen">⛶ Plein écran</button><script src="firebase-config.js"></script><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(()=>{'use strict';const cfg=window.SIFM_CONFIG,clock=document.querySelector('#clock'),stateEl=document.querySelector('#state'),status=document.querySelector('#connection');let peer,connections=new Set(),lastAction=new Map(),reconnectTimer;let s={duration:300,remaining:300000,mode:'stopped',endAt:null,revision:0};const names={stopped:'ARRÊTÉ',running:'EN COURS',paused:'EN PAUSE',finished:'TERMINÉ'};const remaining=()=>s.mode==='running'?Math.max(0,s.endAt-Date.now()):s.remaining;function snapshot(){return {type:'state',duration:s.duration,remaining:remaining(),mode:s.mode,endAt:s.endAt,revision:s.revision,serverTime:Date.now()}}function broadcast(){const m=snapshot();for(const c of connections)if(c.open)try{c.send(m)}catch{}}function render(){let ms=remaining();if(s.mode==='running'&&ms<=0){s.mode='finished';s.remaining=0;s.endAt=null;s.revision++;broadcast()}const seconds=Math.ceil(ms/1000);clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');clock.className='clock'+(seconds<=10?' red':seconds<=30?' orange':'');stateEl.textContent=names[s.mode]||s.mode}function handle(msg,c){if(!msg||typeof msg!=='object')return;if(msg.type==='ping'){c.send(snapshot());return}if(msg.type!=='command'||typeof msg.id!=='string'||msg.id.length>100)return;if(lastAction.has(msg.id)){c.send(snapshot());return}lastAction.set(msg.id,Date.now());if(lastAction.size>150){const k=lastAction.keys().next().value;lastAction.delete(k)}const ms=remaining();switch(msg.action){case 'set':if(s.mode==='stopped'||s.mode==='finished'){const n=Number(msg.seconds);if(Number.isInteger(n)&&n>=1&&n<=5999){s.duration=n;s.remaining=n*1000;s.mode='stopped';s.endAt=null}}break;case 'start':if(s.mode==='stopped'||s.mode==='finished'){s.remaining=s.duration*1000;s.endAt=Date.now()+s.remaining;s.mode='running'}break;case 'pause':if(s.mode==='running'){s.remaining=ms;s.endAt=null;s.mode='paused'}break;case 'resume':if(s.mode==='paused'&&s.remaining>0){s.endAt=Date.now()+s.remaining;s.mode='running'}break;case 'reset':s.remaining=s.duration*1000;s.endAt=null;s.mode='stopped';break;default:return}s.revision++;broadcast();render()}function connect(){clearTimeout(reconnectTimer);status.textContent='Connexion au service…';try{peer=new Peer(cfg.peerId,{debug:0});peer.on('open',()=>{status.textContent='Prêt · Code '+cfg.code});peer.on('connection',c=>{connections.add(c);c.on('open',()=>{status.textContent='Commande connectée';c.send(snapshot())});c.on('data',m=>handle(m,c));c.on('close',()=>{connections.delete(c);status.textContent='Prêt · Code '+cfg.code});c.on('error',()=>connections.delete(c))});peer.on('disconnected',()=>{status.textContent='Service déconnecté · reconnexion…';try{peer.reconnect()}catch{schedule()}});peer.on('error',e=>{status.textContent=e.type==='unavailable-id'?'Code déjà utilisé sur un autre affichage':'Erreur de connexion · nouvelle tentative…';if(e.type!=='unavailable-id')schedule()});peer.on('close',schedule)}catch{schedule()}}function schedule(){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{try{peer?.destroy()}catch{}connect()},4000)}document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};setInterval(render,100);setInterval(broadcast,2000);render();connect()})();
</script></body></html>
