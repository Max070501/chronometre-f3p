<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIFM 2026 — Affichage</title><link rel="stylesheet" href="style.css"></head><body class="display"><div class="display-content"><img class="logo" src="assets/logo.png" alt="Logo SIFM"><main class="center"><div id="clock" class="clock">05:00</div><div id="state" class="state">ARRÊTÉ</div></main><div class="flags" aria-label="Nations participantes"><img class="flag" src="assets/de.svg" alt="Allemagne"><img class="flag" src="assets/at.svg" alt="Autriche"><img class="flag" src="assets/fr.svg" alt="France"><img class="flag" src="assets/cz.svg" alt="République tchèque"><img class="flag" src="assets/sk.svg" alt="Slovaquie"><img class="flag" src="assets/ch.svg" alt="Suisse"></div></div><div id="connection" class="display-status">Connexion au service…</div><button id="fullscreen" class="fullscreen">⛶ Plein écran</button><script src="firebase-config.js"></script><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(()=>{'use strict';const cfg=window.SIFM_CONFIG,clock=document.querySelector('#clock'),stateEl=document.querySelector('#state'),status=document.querySelector('#connection');let peer,connections=new Set(),lastAction=new Map(),reconnectTimer;let s={duration:300,remaining:300000,mode:'stopped',endAt:null,revision:0};const names={stopped:'ARRÊTÉ',running:'EN COURS',paused:'EN PAUSE',finished:'TERMINÉ'};const remaining=()=>s.mode==='running'?Math.max(0,s.endAt-Date.now()):s.remaining;function snapshot(){return {type:'state',duration:s.duration,remaining:remaining(),mode:s.mode,endAt:s.endAt,revision:s.revision,serverTime:Date.now()}}function broadcast(){const m=snapshot();for(const c of connections)if(c.open)try{c.send(m)}catch{}}function render(){let ms=remaining();if(s.mode==='running'&&ms<=0){s.mode='finished';s.remaining=0;s.endAt=null;s.revision++;broadcast()}const seconds=Math.ceil(ms/1000);clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');clock.className='clock'+(seconds<=10?' red':seconds<=30?' orange':'');stateEl.textContent=names[s.mode]||s.mode}function handle(msg,c){if(!msg||typeof msg!=='object')return;if(msg.type==='ping'){c.send(snapshot());return}if(msg.type!=='command'||typeof msg.id!=='string'||msg.id.length>100)return;if(lastAction.has(msg.id)){c.send(snapshot());return}lastAction.set(msg.id,Date.now());if(lastAction.size>150){const k=lastAction.keys().next().value;lastAction.delete(k)}const ms=remaining();switch(msg.action){case 'set':if(s.mode==='stopped'||s.mode==='finished'){const n=Number(msg.seconds);if(Number.isInteger(n)&&n>=1&&n<=5999){s.duration=n;s.remaining=n*1000;s.mode='stopped';s.endAt=null}}break;case 'start':if(s.mode==='stopped'||s.mode==='finished'){s.remaining=s.duration*1000;s.endAt=Date.now()+s.remaining;s.mode='running'}break;case 'pause':if(s.mode==='running'){s.remaining=ms;s.endAt=null;s.mode='paused'}break;case 'resume':if(s.mode==='paused'&&s.remaining>0){s.endAt=Date.now()+s.remaining;s.mode='running'}break;case 'reset':s.remaining=s.duration*1000;s.endAt=null;s.mode='stopped';break;default:return}s.revision++;broadcast();render()}function connect(){clearTimeout(reconnectTimer);status.textContent='Connexion au service…';try{peer=new Peer(cfg.peerId,{debug:0});peer.on('open',()=>{status.textContent='Prêt · Code '+cfg.code});peer.on('connection',c=>{connections.add(c);c.on('open',()=>{status.textContent='Commande connectée';c.send(snapshot())});c.on('data',m=>handle(m,c));c.on('close',()=>{connections.delete(c);status.textContent='Prêt · Code '+cfg.code});c.on('error',()=>connections.delete(c))});peer.on('disconnected',()=>{status.textContent='Service déconnecté · reconnexion…';try{peer.reconnect()}catch{schedule()}});peer.on('error',e=>{status.textContent=e.type==='unavailable-id'?'Code déjà utilisé sur un autre affichage':'Erreur de connexion · nouvelle tentative…';if(e.type!=='unavailable-id')schedule()});peer.on('close',schedule)}catch{schedule()}}function schedule(){clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{try{peer?.destroy()}catch{}connect()},4000)}document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};setInterval(render,100);setInterval(broadcast,2000);render();connect()})();
</script></body></html>
