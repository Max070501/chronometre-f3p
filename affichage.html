<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F3P — Affichage</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffffff;color:#111827;font-family:Arial,sans-serif}main{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1.35fr) minmax(0,1fr);padding:2vh 3vw;gap:1vh}.flags{display:flex;align-items:center;justify-content:space-around;gap:3vw;min-height:0}.flags img{display:block;width:min(25vw,31vh);height:min(15vw,19vh);object-fit:contain;filter:drop-shadow(0 3px 6px #0002)}#clock{align-self:center;justify-self:center;white-space:nowrap;font-size:min(27vw,43vh);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1;cursor:pointer;user-select:none}.warn{color:#ffb33b!important}.danger{color:#ff414d!important}#overlay{position:fixed;inset:0;background:rgba(255,255,255,.97);color:#111111;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1rem;z-index:5;text-align:center;font-size:clamp(22px,4vw,48px)}#overlay.visible{display:flex}#code{font-size:clamp(65px,11vw,140px);font-weight:800;letter-spacing:.09em;color:#000000;background:#f2f5f9;border:4px solid #111;border-radius:18px;padding:.12em .35em}#overlay button{background:#111827;color:white;border:0;border-radius:10px;padding:12px 26px;font-size:20px;cursor:pointer}@media(max-width:650px){main{padding:2vh 2vw;grid-template-rows:1fr 1.3fr 1fr}.flags img{width:29vw;height:17vw}#clock{font-size:28vw}}
</style></head><body><main><div class="flags"><img src="https://flagcdn.com/w320/at.png" alt="Autriche"><img src="https://flagcdn.com/w320/cz.png" alt="Tchéquie"><img src="https://flagcdn.com/w320/fr.png" alt="France"></div><div id="clock" title="Cliquer pour afficher le code écran">05:00</div><div class="flags"><img src="https://flagcdn.com/w320/de.png" alt="Allemagne"><img src="https://flagcdn.com/w320/sk.png" alt="Slovaquie"><img src="https://flagcdn.com/w320/ch.png" alt="Suisse"></div></main><div id="overlay"><div>CODE ÉCRAN</div><div id="code">Connexion…</div><button id="close">Fermer</button></div><script>const showCode=()=>document.getElementById('overlay').classList.add('visible');const hideCode=()=>document.getElementById('overlay').classList.remove('visible');document.getElementById('clock').addEventListener('click',showCode);document.getElementById('close').addEventListener('click',hideCode);document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='c')showCode();if(e.key==='Escape')hideCode();if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});</script><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
const $=id=>document.getElementById(id);let duration=300,remaining=300,deadline=0,running=false,clients=[];let screenCode='';const prefix='f3p-chrono-simple-';
function now(){return Date.now()}function left(){return running?Math.max(0,Math.ceil((deadline-now())/1000)):remaining}function state(){return {type:'state',duration,remaining:left(),running,deadline,serverTime:now()}}function send(){const s=state();clients=clients.filter(c=>c.open);clients.forEach(c=>{try{c.send(s)}catch(e){}})}function render(){let t=left();if(running&&t===0){running=false;remaining=0;send()}$('clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');$('clock').className=t<=10?'danger':t<=30?'warn':'';}function command(m){if(!m||typeof m!=='object')return;if(m.type==='set'){const s=Number(m.seconds);if(Number.isInteger(s)&&s>=1&&s<=35999){duration=s;remaining=s;running=false}}else if(m.type==='start'){if(!running&&remaining>0){deadline=now()+remaining*1000;running=true}}else if(m.type==='pause'){remaining=left();running=false}else if(m.type==='reset'){remaining=duration;running=false}else return;render();send()}
function connect(){if(!window.Peer){console.log='Bibliothèque indisponible';return}screenCode='070501';$('code').textContent=screenCode.slice(0,3)+' '+screenCode.slice(3);const peer=new Peer(prefix+screenCode);peer.on('open',()=>{console.log='En attente de la télécommande'});peer.on('connection',c=>{clients.push(c);c.on('open',()=>{console.log='Télécommande connectée';c.send(state())});c.on('data',command);c.on('close',()=>{console.log='Télécommande déconnectée';clients=clients.filter(x=>x!==c)})});peer.on('error',e=>{if(e.type==='unavailable-id'){$('code').textContent='CODE DÉJÀ UTILISÉ';showCode();console.error('Le code 070501 est déjà utilisé par un autre écran. Fermez les autres onglets d’affichage.')}else console.error('Erreur de connexion : '+e.type)})}setInterval(render,100);setInterval(send,1000);connect();
</script></body></html>
